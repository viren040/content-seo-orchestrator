# ============================================================
# SEO Pipeline Global Settings — Template
# Edit this file with your brand's values, or copy
# config/seo-settings.example.yaml as a starting point.
# Referenced by all /seo-* commands.
# ============================================================

brand:
  name: "Your Brand"
  tagline: "Your one-line positioning"
  author_default: "Your Brand Team"
  author_personal: "Your Name"
  cta_url: "/demo"            # Primary CTA path (relative to website)
  get_audit_url: "/get-audit" # Secondary CTA (optional)
  website: "https://example.com"

# CMS — Sanity reference implementation.
# Swap for your CMS by editing .claude/commands/seo-publish.md.
sanity:
  project_id: "your-project-id"   # Or set $SANITY_PROJECT_ID in .env
  dataset: production
  schema_type: blogPost

seo_defaults:
  schema_type: "BlogPosting"
  meta_title_max: 70
  meta_title_ideal: "50-60"
  meta_description_max: 160
  meta_description_ideal: "150-160"
  excerpt_max: 250
  excerpt_ideal: "150-200"
  min_word_count: 1200
  keyword_density_target: "1-2%"
  min_internal_links: 3
  min_faqs: 3
  max_faqs: 6

content_rules:
  voice: "Precise, Confident, Useful"
  brand_pillars:
    - "Pillar 1 — short descriptor"
    - "Pillar 2 — short descriptor"
    - "Pillar 3 — short descriptor"
  content_pillars:
    - your-topic-cluster-1
    - your-topic-cluster-2
    - your-topic-cluster-3
  tone_guidelines:
    - "No fluff — every sentence earns its place"
    - "Data-backed claims with sources"
    - "Write for practitioners, not beginners"
    - "Use real customer examples, not hypotheticals"
    - "CTA feels natural, not salesy"

design:
  colors:
    primary_bg: "#000000"
    primary_accent: "#3366FF"
    success: "#00C9B1"
    warning: "#F5A623"
  fonts:
    headline: "Inter"
    body: "Inter"
  canva_brand_kit_id: ""

# Optional file paths the commands read for richer context.
# Use absolute paths or paths relative to the repo root.
paths:
  planning_brief: "./docs/planning-brief.md"   # Per-post Perplexity prompts
  playbook_reference: "./docs/seo-playbook.md"
  image_generator: "./generate-blog-images.py"
  blog_images: "./blog-images"
  output: "./output"
  brand_bible: "./docs/brand-bible.md"
  figma_diagrams: "./docs/figma-diagrams.md"
