version: 1
project: "your-d2c-blog"
last_updated: "2026-05-19"

sanity:
  project_id: "REPLACE_WITH_YOUR_SANITY_ID"
  dataset: production
  document_type: blogPost

posts:

  # ---- Buying-guide content (high commercial intent) ----
  - id: "1.1"
    title: "Best {{Product Category}} in 2026: Honest Buyer's Guide"
    slug: "best-product-category-2026"
    pillar: "buying-guides"
    primary_keyword: "best {{product category}} 2026"
    secondary_keywords:
      - "best {{product category}} for {{use case}}"
      - "top {{product category}} brands"
    keyword_volume: 1400
    keyword_difficulty: 22
    word_count_target: 2200
    content_angle: "Honest 5-7 product roundup. We can be one; don't pretend we're the only good option. AEO-shaped (FAQ section + named brand comparisons)."
    schema_type: "BlogPosting"
    internal_links:
      - { anchor: "Shop our {{collection}}", url: "/collections/{{slug}}" }
      - { anchor: "How we compare", url: "/pages/comparison" }
      - { anchor: "Reviews", url: "/pages/reviews" }
    publish_order: 1
    status: { research: pending, brief: pending, content: pending, seo_review: pending, sanity_draft: pending, published: pending }

