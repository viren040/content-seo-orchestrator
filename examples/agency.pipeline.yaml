  dataset: production
  document_type: blogPost

posts:

  # ---- Methodology / IP posts (the agency's moat) ----
  - id: "1.1"
    title: "Our {{Methodology Name}}: How We {{Outcome}} for {{Client Type}}"
    slug: "methodology-explainer"
    pillar: "agency-methodology"
    primary_keyword: "{{methodology name}}"
    secondary_keywords:
      - "how to {{outcome}}"
      - "{{methodology}} framework"
    keyword_volume: 180
    keyword_difficulty: 5
    word_count_target: 2000
    content_angle: "Branded methodology with a memorable name. Step-by-step framework. Shows your IP without giving away delivery. Lead magnet."
    schema_type: "HowTo"
    internal_links:
      - { anchor: "Hire us for {{service}}", url: "/services/{{slug}}" }
      - { anchor: "Case studies", url: "/case-studies" }
      - { anchor: "Book an intro call", url: "/contact" }
